{# Quick add form. Used on the welcome page and on the dashboard. #}
{% include "_paste_box.html" %}
<form action="/expenses" method="post" class="add-form" id="add-form">
  <div class="add-row">
    <label class="grow">What was it?
      <input type="text" name="description" id="f-desc" list="past-descriptions" required maxlength="80"
             placeholder="e.g. Groceries, Rent, Phone bill" value="{{ form.description or '' }}"
             autocomplete="off">
    </label>
    <label class="amount">Amount
      <input type="text" inputmode="decimal" name="amount" required placeholder="0.00"
             value="{{ form.amount or '' }}">
    </label>
  </div>
  <datalist id="past-descriptions">
    {% for d, c in past %}<option value="{{ d }}">{% endfor %}
  </datalist>

  <div class="add-row">
    <label class="grow">Category
      <select name="category" id="f-cat" required>
        <option value="" disabled {% if not form.category %}selected{% endif %}>Choose one</option>
        <optgroup label="Needs">
          {% for name, kind in CATEGORIES.items() if kind == "need" %}
          <option {% if form.category == name %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="Wants">
          {% for name, kind in CATEGORIES.items() if kind == "want" %}
          <option {% if form.category == name %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </optgroup>
      </select>
    </label>
    <label>Date
      <input type="date" name="day" value="{{ form.day or today }}">
    </label>
    <button type="submit" class="add-button">Add expense</button>
  </div>
</form>
<script>
  // if you type something you've logged before, pick its category for you
  (function () {
    const past = {{ past | tojson }};
    const known = {};
    past.forEach(([desc, cat]) => { known[desc.toLowerCase()] = cat; });
    const desc = document.getElementById("f-desc");
    const cat = document.getElementById("f-cat");
    desc.addEventListener("input", () => {
      const match = known[desc.value.trim().toLowerCase()];
      if (match) cat.value = match;
    });
  })();
</script>
