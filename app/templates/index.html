<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BiteBudget</title>
</head>
<body>
  <h1>BiteBudget</h1>
  <p>Upload your food delivery order history (CSV) to see where your money goes.</p>
  <form action="/analyze" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".csv" required>
    <button type="submit">Analyze</button>
  </form>
  <p>No file? <a href="/sample">Try the sample data</a></p>
</body>
</html>
